<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mockup 4 — Aurora gradient</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F5EFE8; font-family: system-ui, sans-serif; }
  #info { position: fixed; top: 12px; left: 12px; color: #191316; background: rgba(245,239,232,0.78); padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.4; max-width: 360px; pointer-events: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #info b { color: #8E2C5F; }
  #c { display: block; }
</style>
</head>
<body>
<div id="info">
  <b>Mockup 4 — Aurora gradient</b><br/>
  A slow-drifting WebGL gradient mesh in your existing palette tokens (cream, lavender, sage, rose) wraps the hex islands. Single shader pass.<br/>
  Drag to orbit · scroll to zoom.
</div>
<canvas id="c"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Palette tokens from src/app/theme/index.css
const PALETTE = {
  cream:    new THREE.Color('#F5EFE8'),
  bone:     new THREE.Color('#F0E8DC'),
  lavender: new THREE.Color('#E8DCE0'),
  rose:     new THREE.Color('#C884A2'),
  magenta:  new THREE.Color('#8E2C5F'),
  sage:     new THREE.Color('#6E825C'),
};

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 9, 14);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.48;
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xFFF6E5, 0.95);
key.position.set(-7.2, 4.8, -4.8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -20; key.shadow.camera.right = 20;
key.shadow.camera.top = 20; key.shadow.camera.bottom = -20;
key.shadow.bias = -0.0008;
scene.add(key);
scene.add(new THREE.DirectionalLight(0xCDE0F0, 0.35).position.set(8, 6, 6));

// ─── Hex islands ────────────────────────────────────────────────────────
const HEX_R = 0.9, HEX_H = 0.45;
const HEX_POSITIONS = [
  [-3.6, -2.2], [-2.0, -2.7], [-2.6, -1.0], [-4.0, -0.8],
  [ 3.6, -3.0], [ 4.6, -1.6], [ 3.2, -1.0],
  [ 0.2,  3.2], [ 1.6,  4.1], [-1.2,  3.6],
];
const hexGeom = new THREE.CylinderGeometry(HEX_R, HEX_R, HEX_H, 6, 1);
const hexMat = new THREE.MeshStandardMaterial({ color: '#F5EFE8', roughness: 0.78 });
for (const [x, z] of HEX_POSITIONS) {
  const m = new THREE.Mesh(hexGeom, hexMat);
  m.position.set(x, -HEX_H / 2, z);
  m.rotation.y = Math.PI / 6;
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}

// ─── Aurora gradient skydome ────────────────────────────────────────────
const auroraUniforms = {
  uTime:    { value: 0 },
  uCream:   { value: PALETTE.cream },
  uBone:    { value: PALETTE.bone },
  uLavender:{ value: PALETTE.lavender },
  uRose:    { value: PALETTE.rose },
  uSage:    { value: PALETTE.sage },
};
const auroraMat = new THREE.ShaderMaterial({
  uniforms: auroraUniforms,
  side: THREE.BackSide,
  depthWrite: false,
  vertexShader: /* glsl */ `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */ `
    uniform float uTime;
    uniform vec3 uCream, uBone, uLavender, uRose, uSage;
    varying vec3 vWorldPos;

    // Smooth blob falloff.
    float blob(vec2 p, vec2 c, float r) {
      float d = distance(p, c);
      return 1.0 - smoothstep(0.0, r, d);
    }

    void main() {
      // Project world position to a (x, y) UV-like space. Larger spread → softer.
      vec2 p = vWorldPos.xy * 0.025;
      float t = uTime * 0.06;

      // Four drifting color anchors.
      vec2 c1 = vec2(sin(t * 0.9) * 0.6, cos(t * 0.7) * 0.5);
      vec2 c2 = vec2(cos(t * 0.8 + 1.4) * 0.7, sin(t * 0.6 + 0.3) * 0.55);
      vec2 c3 = vec2(sin(t * 0.5 + 2.1) * 0.65, cos(t * 0.85 + 1.9) * 0.6);
      vec2 c4 = vec2(cos(t * 0.65 + 3.3) * 0.6, sin(t * 0.95 + 2.6) * 0.5);

      float w1 = blob(p, c1, 1.4);
      float w2 = blob(p, c2, 1.5);
      float w3 = blob(p, c3, 1.3);
      float w4 = blob(p, c4, 1.6);

      // Layered color blend over the cream base.
      vec3 col = uCream;
      col = mix(col, uLavender, w1 * 0.85);
      col = mix(col, uSage,     w2 * 0.32);
      col = mix(col, uRose,     w3 * 0.45);
      col = mix(col, uBone,     w4 * 0.55);

      // Subtle vertical wash (lighter up, slightly cooler down) for depth.
      float v = clamp((vWorldPos.y + 30.0) / 60.0, 0.0, 1.0);
      col = mix(col * 0.96, col, v);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(60, 48, 32), auroraMat);
scene.add(sky);

// Ground plane — same shader, so floor & sky read continuous.
const groundMat = new THREE.ShaderMaterial({
  uniforms: auroraUniforms,
  side: THREE.FrontSide,
  vertexShader: auroraMat.vertexShader,
  fragmentShader: auroraMat.fragmentShader,
});
const groundGeom = new THREE.PlaneGeometry(60, 60);
groundGeom.rotateX(-Math.PI / 2);
const ground = new THREE.Mesh(groundGeom, groundMat);
ground.position.y = -HEX_H / 2 - 0.02;
// Cannot receiveShadow on a ShaderMaterial without writing the shadow chunk;
// for the mockup we accept slightly softer hex grounding.
scene.add(ground);

// ─── Resize / loop ──────────────────────────────────────────────────────
addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function tick() {
  auroraUniforms.uTime.value = clock.getElapsedTime();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
