<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mockup 2 — Bathymetric chart</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #EEF1F2; font-family: system-ui, sans-serif; }
  #info { position: fixed; top: 12px; left: 12px; color: #191316; background: rgba(245,239,232,0.86); padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.4; max-width: 360px; pointer-events: none; }
  #info b { color: #8E2C5F; }
  #c { display: block; }
</style>
</head>
<body>
<div id="info">
  <b>Mockup 2 — Bathymetric chart</b><br/>
  Pale blue isobath rings radiate from each hex island, like a nautical depth chart. Zero-GPU 2D texture baked onto the ground.<br/>
  Drag to orbit · scroll to zoom.
</div>
<canvas id="c"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PALETTE = {
  cream:    '#F5EFE8',
  rose:     '#C884A2',
  magenta:  '#8E2C5F',
  ink:      '#191316',
  muted:    '#4A4046',
};

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#EEF1F2');

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 9, 14);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.48;
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const key = new THREE.DirectionalLight(0xFFF6E5, 1.05);
key.position.set(-7.2, 4.8, -4.8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -20; key.shadow.camera.right = 20;
key.shadow.camera.top = 20; key.shadow.camera.bottom = -20;
key.shadow.bias = -0.0008;
scene.add(key);
scene.add(new THREE.DirectionalLight(0xCDE0F0, 0.4).position.set(8, 6, 6));

// ─── Hex islands (placeholders) ─────────────────────────────────────────
const HEX_R = 0.9;
const HEX_H = 0.45;

const ISLANDS = [
  { center: [-3.0, -1.7], hexes: [[-3.6, -2.2], [-2.0, -2.7], [-2.6, -1.0], [-4.0, -0.8]] },
  { center: [ 3.8, -1.9], hexes: [[ 3.6, -3.0], [ 4.6, -1.6], [ 3.2, -1.0]] },
  { center: [ 0.2,  3.6], hexes: [[ 0.2,  3.2], [ 1.6,  4.1], [-1.2,  3.6]] },
];

const hexGeom = new THREE.CylinderGeometry(HEX_R, HEX_R, HEX_H, 6, 1);
const hexMat = new THREE.MeshStandardMaterial({ color: PALETTE.cream, roughness: 0.78 });
for (const island of ISLANDS) {
  for (const [x, z] of island.hexes) {
    const m = new THREE.Mesh(hexGeom, hexMat);
    m.position.set(x, -HEX_H / 2, z);
    m.rotation.y = Math.PI / 6;
    m.castShadow = true;
    m.receiveShadow = true;
    scene.add(m);
  }
}

// ─── Bathymetric texture (baked onto the sea floor) ─────────────────────
const PLANE_SIZE = 60;
const TEX_SIZE = 2048;
const worldToPx = (w) => (w + PLANE_SIZE / 2) * (TEX_SIZE / PLANE_SIZE);

const cnv = document.createElement('canvas');
cnv.width = TEX_SIZE; cnv.height = TEX_SIZE;
const ctx = cnv.getContext('2d');

// Base wash — pale blue-on-cream gradient.
const grd = ctx.createRadialGradient(TEX_SIZE / 2, TEX_SIZE / 2, 0, TEX_SIZE / 2, TEX_SIZE / 2, TEX_SIZE * 0.62);
grd.addColorStop(0.00, '#F5EFE8');
grd.addColorStop(0.45, '#D9E4E8');
grd.addColorStop(1.00, '#9FBCC4');
ctx.fillStyle = grd;
ctx.fillRect(0, 0, TEX_SIZE, TEX_SIZE);

// Subtle paper noise overlay.
const noise = ctx.createImageData(TEX_SIZE, TEX_SIZE);
for (let i = 0; i < noise.data.length; i += 4) {
  const n = (Math.random() - 0.5) * 12;
  noise.data[i + 0] = 255 + n;
  noise.data[i + 1] = 255 + n;
  noise.data[i + 2] = 255 + n;
  noise.data[i + 3] = 18;
}
ctx.putImageData(noise, 0, 0);

// Concentric isobath rings around each island.
ctx.lineCap = 'round';
for (const island of ISLANDS) {
  const cx = worldToPx(island.center[0]);
  const cz = worldToPx(island.center[1]);
  for (let i = 0; i < 9; i++) {
    const rWorld = 2.0 + i * 1.05;
    const rPx = rWorld * (TEX_SIZE / PLANE_SIZE);
    const alpha = 0.55 - i * 0.05;
    ctx.beginPath();
    ctx.arc(cx, cz, rPx, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(38, 70, 92, ${Math.max(0.08, alpha)})`;
    ctx.lineWidth = i === 0 ? 4 : 2;
    ctx.stroke();

    // Depth label every 3rd ring.
    if (i > 0 && i % 3 === 0) {
      ctx.save();
      ctx.translate(cx + rPx * 0.72, cz - rPx * 0.72);
      ctx.font = '500 22px ui-monospace, monospace';
      ctx.fillStyle = 'rgba(38, 70, 92, 0.55)';
      ctx.fillText(`−${i * 10}m`, 0, 0);
      ctx.restore();
    }
  }
}

// Faint cardinal compass strokes (subtle chart vibe).
ctx.font = '500 28px ui-monospace, monospace';
ctx.fillStyle = 'rgba(38, 70, 92, 0.4)';
ctx.fillText('N', TEX_SIZE / 2 - 12, 64);
ctx.fillText('S', TEX_SIZE / 2 - 12, TEX_SIZE - 38);
ctx.fillText('W', 24, TEX_SIZE / 2 + 10);
ctx.fillText('E', TEX_SIZE - 48, TEX_SIZE / 2 + 10);

const bathyTex = new THREE.CanvasTexture(cnv);
bathyTex.anisotropy = 8;
bathyTex.colorSpace = THREE.SRGBColorSpace;

const seaGeom = new THREE.PlaneGeometry(PLANE_SIZE, PLANE_SIZE);
seaGeom.rotateX(-Math.PI / 2);
const seaMat = new THREE.MeshStandardMaterial({
  map: bathyTex,
  roughness: 0.95,
  metalness: 0.0,
});
const sea = new THREE.Mesh(seaGeom, seaMat);
sea.position.y = -HEX_H / 2 - 0.02;
sea.receiveShadow = true;
scene.add(sea);

// ─── Resize / loop ──────────────────────────────────────────────────────
addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function tick() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
