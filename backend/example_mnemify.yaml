raw_root: .mnemify/raw          # Where native-format bytes are stored
converter_version: "0.1.0"

# Copy this to `mnemify.yaml` (gitignored) and fill in your own values.
# Tokens live in `.env`, not here — these are just the env-var *names*.

sources:
  notion:
    enabled: true
    token_env: NOTION_TOKEN
    concurrency: 5

  confluence:
    enabled: false
    base_url: "https://your-team.atlassian.net/wiki"
    email_env: CONFLUENCE_EMAIL
    token_env: CONFLUENCE_API_TOKEN
    space_keys: ["DOCS", "PROD"]   # which spaces to harvest
    concurrency: 3

  obsidian:
    enabled: false
    vault_path: "~/Documents/Notes"
    concurrency: 10

