containers:
  confluence:
    # Formal, team-authored docs. space key -> description
    ENG: "Engineering: ADRs, system design, eng policies (code review, on-call, perf reviews), postmortems."
    PLAT: "Payments & Platform: ACH pipeline design, cut-over plan, runbooks, Pillar integration docs, reconciliation."
    SEC: "Security & Compliance: SOC 2, BSA/AML, data retention, vendor risk, access reviews, security reviews."
  notion:
    # Two levels max: one root page per teamspace, every other page is a child of a root.
    roots:
      - {title: "Leadership", what: "Board updates, Series B, investor prep, strategy, exec staff notes."}
      - {title: "Product", what: "Investing PRD, launch checklist, go/no-go notes, card issuing, pricing."}
      - {title: "Hiring", what: "JDs, scorecards, funnel health, candidate notes, VP Eng search."}
      - {title: "Meeting Notes", what: "Weekly eng staff, Pillar MBRs/QBRs, launch standups."}
  obsidian_vault: "Maya"      # personal vault; folders: 1on1s/, Daily/, People/, Projects/, Reflections/, Reading/
  local_notes: "Notes"        # ~/Notes: drafts, scratch, checklists, talk drafts; folders: drafts/, scratch/, board/

# Frontmatter contract — EVERY corpus file starts with YAML frontmatter.
frontmatter:
  common_required: [title, author, created, updated]   # dates as YYYY-MM-DD; created <= updated <= 2026-10-09
  confluence_extra: {space: "ENG|PLAT|SEC", labels: "[list]"}
  notion_extra: {parent: "<root page title, omitted for root pages>"}
  obsidian_extra: {tags: "[list]"}
  notes_extra: {}   # local notes: nothing else

writing_rules:
  - "Body starts with '# <title>'. Then real content. 250-900 words typical; daily notes and scratch can be 80-250."
  - "Realistic voice per source: Confluence = structured/team voice; Notion = meeting notes, plans, PRDs; Obsidian = Maya's private first-person, terse, wikilinks; local notes = rough drafts and checklists."
  - "Write open TODOs as markdown checkboxes with owner and explicit date: '- [ ] Devon: delete Sidekiq ACH code by 2026-10-16'. Closed ones as '- [x] ...'. Most open todos due between 2026-09-28 and 2026-10-23."
  - "Decisions: write them as 'Decision: ...' lines. Open questions: 'Open question: ...'. Risks: 'Risk: ...'. These feed Mnemify's signal extraction."
  - "Cross-reference other docs by their exact title (Confluence/Notion/local) or [[wikilink]] (Obsidian only, must resolve to a vault note)."
  - "No real people, no real company internals, no URLs except obvious fakes. No emails/phone numbers."
