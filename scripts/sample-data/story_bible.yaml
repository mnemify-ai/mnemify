# Story bible for the Mnemify sample workspace.
#
# Every corpus document (corpus/{notion,confluence,obsidian/Maya,notes,late})
# is written FROM this file. Authors must not invent new people, companies,
# numbers or dates that contradict it. Small supporting details (a Slack
# quote, a config value, a meeting room) are fine.
#
# Everything here is fictional. Stencil, Pillar Bank, Northfield Ventures and
# all people are made up; real vendor names (Plaid, DriveWealth, Lithic,
# Alloy, Persona, Snowflake, AWS) appear only as vendors.

anchor_date: 2026-10-09          # Friday. "Today" in the story. Compile date.
timeline_start: 2026-02-01
timeline_end: 2026-10-09         # Nothing is dated after this, except corpus/late (2026-10-10).

company:
  name: Stencil
  what: >
    Consumer fintech app for automated saving. Round-ups, goals-based savings
    buckets, a $6/mo "Pro Plus" subscription, and (launching now) ETF investing.
    Banking-as-a-service on top of a sponsor bank (Pillar Bank).
  hq: San Francisco (hybrid; eng also in Denver and remote)
  size: 64 people, 31 in engineering (Oct 2026)
  stack: Ruby on Rails monolith (legacy), Go services (new money movement), Postgres (system of record), Redis, Sidekiq (non-ACH jobs), AWS (SQS FIFO, RDS, EKS), Snowflake (analytics; ML features moved to Postgres per ADR-030), Swift/SwiftUI + TCA iOS app, Kotlin Android app, Datadog, PagerDuty, Linear, Slack.
  metrics:
    may_2026: {mau: 120k, mtu: 78k, sub_arr: "$4.1M", burn: "$480k/mo", runway_months: 19}
    sep_2026: {mau: 151k, mtu: 101k, sub_arr: "$5.3M", burn: "$540k/mo", runway_months: 15}
  vendors: {bank_linking: Plaid, brokerage: DriveWealth, card_issuing: Lithic, kyc_old: Persona, kyc_new: Alloy, sponsor_bank: Pillar Bank, soc2_auditor: "Ledgerwise Assurance (fictional)", search_firm: "Hollis Partners (fictional)"}

